services:
  postgres:
    image: postgres:16-alpine
    container_name: saltbox-postgres
    environment:
      POSTGRES_DB: saltbox
      POSTGRES_USER: saltbox
      POSTGRES_PASSWORD: saltbox
    ports:
      - "5432:5432"
    volumes:
      - saltbox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saltbox -d saltbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saltbox_pg:
